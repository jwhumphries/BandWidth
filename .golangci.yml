# golangci-lint v2 configuration
# Based on the Uber Go Style Guide's recommended linters.
#
# Default "standard" linters (enabled automatically):
#   errcheck, govet, ineffassign, staticcheck, unused
#
# Additional linters enabled below complement the defaults
# per the style guide's recommendations.

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - revive
  exclusions:
    rules:
      # The version package intentionally mirrors the maintainer's other
      # apps; revive flags it for colliding with stdlib go/version.
      - path: version/version.go
        linters:
          - revive
        text: 'var-naming: avoid package names'
      # The mail package name is intentional; net/mail is rarely imported
      # directly and the name communicates purpose clearly.
      - path: internal/mail/mail.go
        linters:
          - revive
        text: 'var-naming: avoid package names'

formatters:
  enable:
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
