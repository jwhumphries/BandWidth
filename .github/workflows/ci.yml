name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DAGGER_NO_NAG: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Check
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "latest"
          verb: call
          module: .dagger
          args: check --source=.

  release:
    runs-on: ubuntu-latest
    # dev is the development branch — skip the release image build on dev
    # pushes (it still runs on PRs to main, on main, and on other branches).
    # The actual publish/deploy lives in publish.yml (main + tags only).
    if: github.ref != 'refs/heads/dev'
    env:
      DAGGER_NO_NAG: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Release build
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "latest"
          verb: call
          module: .dagger
          args: release --source=. --version=${{ github.sha }}
