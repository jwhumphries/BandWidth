name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DAGGER_NO_NAG: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check
        uses: dagger/dagger-for-github@b81317a976cb7f7125469707321849737cd1b3bc # v7
        with:
          version: "latest"
          verb: call
          module: .dagger
          args: check --source=.

  release:
    runs-on: ubuntu-latest
    # dev is the development branch — skip the release image build on dev
    # pushes (it still runs on PRs to main, on main, and on other branches).
    # The actual publish/deploy lives in publish.yml (main + tags only).
    if: github.ref != 'refs/heads/dev'
    env:
      DAGGER_NO_NAG: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Release build
        uses: dagger/dagger-for-github@b81317a976cb7f7125469707321849737cd1b3bc # v7
        with:
          version: "latest"
          verb: call
          module: .dagger
          args: release --source=. --version=${{ github.sha }}
