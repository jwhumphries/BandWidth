name: Build and Publish Container

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  # Serialize publish/deploy per ref so overlapping pushes to main can't race
  # a Fly rollout. Not cancel-in-progress: never interrupt an in-flight deploy.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # GHCR requires lowercase image paths; this repo is mixed-case
  # (jwhumphries/BandWidth), so the registry ref is hardcoded lowercase to
  # match fly.toml and the justfile.
  IMAGE: ghcr.io/jwhumphries/bandwidth
  DAGGER_NO_NAG: "1"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Dagger
        uses: dagger/dagger-for-github@b81317a976cb7f7125469707321849737cd1b3bc # v7
        with:
          version: "latest"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container
        run: |
          dagger call publish \
            --source . \
            --registry "${{ env.IMAGE }}" \
            --version "${{ github.ref_type == 'tag' && github.ref_name || github.sha }}" \
            --registry-user "${{ github.actor }}" \
            --registry-password env:GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-to-fly:
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
