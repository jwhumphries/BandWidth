name: renovate
on:
  schedule:
    - cron: "45 11 * * 2,5"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Renovate Bot GitHub Action
        uses: renovatebot/github-action@ebcbb513d07ead4d9c0c2139064301db05e84a3e # v46.3.15
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: "info"
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
